name: Ecommerce Final Project CI/CD

on:
  push:
    branches:
      - main # Trigger the workflow on pushes to the main branch
      - master
  pull_request:
    branches:
      - main # Trigger the workflow on pull requests targeting the main branch
      - master

jobs:
  build: #Continuous Integration Job
    runs-on: ubuntu-latest  

    steps:
        # step1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

# step2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the Node.js version

# step3: Install dependencies, run tests, and build the project
      - name: Install dependencies
        run: npm install
        
# step4: Run tests and build the project
      - name: Run tests
        run: npm test

# step5: Build and deploy the project
      - name: Build project
        run: npm run build
     deploy:
        runs-on: ubuntu-latest  
        needs: build # Only run this job if the build job succeeds
    steps:
        # step1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

# step2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the Node.js version

# step3: Install dependencies, run tests, and build the project
      - name: Install dependencies
        run: npm install

# step4: Deploy to Vercel o another hosting servicer cloud provider
        - name: Deploy to Vercel
        run: |
            npm install -g vercel
        vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN_1 }}

      - name: Build React app
        run: npm run build